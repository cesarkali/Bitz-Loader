<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bitz · Loader All</title>
<style>
/* ============================================================
   BITZ · ALL IN ONE — LOADER DE HOSPITALIDADE
   100% CSS, ciclo de 15s em loop perfeito, com ou sem o cenário.
   Fases: desenho da logo -> assinatura -> jornada -> retorno -> logo original
   ============================================================ */

:root{
  --T: 15s;                 /* duração do ciclo completo (vale para os dois modos) */
  --b1:#0057D9;             /* azul Bitz oficial */
  --b2:#3b86ff;
  --b3:#8fc0ff;
  --lift: 195px;            /* quanto a logo sobe na fase da jornada */
}

/* ---- MODO SOLO: só a logo + o fundo animado ----
   Mesmo ciclo de 15s do modo cenário; a logo apenas permanece
   centralizada em tamanho cheio, sem subir nem reduzir. */
html[data-scene="off"] .world-wrap{ display:none }
html[data-scene="off"] .brand-move{ animation:none }

html[data-theme="dark"]{
  --bg0:#03050c; --bg1:#070d1c;
  --ink:#eef4ff;
  --sub:rgba(220,233,255,.55);
  --line:rgba(143,192,255,.20);
  --glowA:rgba(0,87,217,.42);
  --glowB:rgba(59,134,255,.26);
  --grid:rgba(143,192,255,.16);
  --pane:rgba(143,192,255,.05);
  --halo:rgba(0,87,217,.38);
  --neon:#eaf3ff;
  --star:1;
}
html[data-theme="light"]{
  --bg0:#e9eef7; --bg1:#ffffff;
  --ink:#000000;
  --sub:rgba(8,24,54,.55);
  --line:rgba(0,87,217,.20);
  --glowA:rgba(0,87,217,.18);
  --glowB:rgba(59,134,255,.14);
  --grid:rgba(0,87,217,.16);
  --pane:rgba(0,87,217,.04);
  --halo:rgba(0,87,217,.12);
  --neon:#0057D9;
  --star:0;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg1);
  color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  display:grid; place-items:center;
  overflow:hidden;
}
/* atmosfera de fundo */
body::before{
  content:""; position:fixed; inset:-10%;
  background:
    radial-gradient(60% 45% at 50% 6%,  var(--glowA), transparent 62%),
    radial-gradient(70% 50% at 50% 104%, var(--glowB), transparent 62%),
    radial-gradient(40% 40% at 12% 62%, var(--glowB), transparent 65%),
    radial-gradient(40% 40% at 88% 38%, var(--glowB), transparent 65%),
    var(--bg0);
  animation: breathe 15s ease-in-out infinite;
}
@keyframes breathe{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

/* vinheta + textura fina */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
  opacity:var(--star);
}

/* ---------- palco ---------- */
.stage{
  position:relative;
  width:min(1120px, 94vw);
  height:min(660px, 88vh);
  isolation:isolate;
}

/* campo de estrelas */
.stars{
  position:absolute; inset:0; opacity:var(--star); pointer-events:none;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 27% 9%,  #cfe2ff, transparent),
    radial-gradient(1.8px 1.8px at 44% 22%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 63% 12%, #bcd8ff, transparent),
    radial-gradient(1.5px 1.5px at 78% 24%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 91% 15%, #cfe2ff, transparent),
    radial-gradient(1.3px 1.3px at 8% 41%,  #fff, transparent),
    radial-gradient(1.1px 1.1px at 34% 36%, #bcd8ff, transparent),
    radial-gradient(1.4px 1.4px at 70% 40%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 96% 46%, #cfe2ff, transparent);
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{opacity:calc(var(--star) * .75)} 50%{opacity:calc(var(--star) * .3)} }

/* ---------- LOGO ---------- */
.brand-move{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  animation: brandMove var(--T) cubic-bezier(.65,.02,.25,1) infinite;
  z-index:3;
}
@keyframes brandMove{
  0%, 26%   { transform:translate(-50%,-50%) scale(1); }
  33%, 75%  { transform:translate(-50%, calc(-50% - var(--lift))) scale(.5); }
  83%, 100% { transform:translate(-50%,-50%) scale(1); }
}

.brand-float{ position:relative; animation: dissolve var(--T) linear infinite; }

/* halo que respira atrás da marca */
.halo{
  position:absolute; left:50%; top:50%;
  width:82%; height:170%;
  transform:translate(-50%,-50%);
  background:radial-gradient(50% 50% at 50% 50%, var(--halo), transparent 70%);
  filter:blur(22px);
  pointer-events:none; z-index:-1;
  animation: halo 5s ease-in-out infinite;
}
@keyframes halo{
  0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(1) }
  50%    { opacity:.95; transform:translate(-50%,-50%) scale(1.08) }
}
@keyframes dissolve{
  0%, 92%   { filter:blur(0px); transform:scale(1); }
  97%       { filter:blur(0px); transform:scale(1.03); }
  100%      { filter:blur(7px); transform:scale(1.09); }
}

.brand{
  display:block;
  width:min(720px, 76vw);
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 0 26px rgba(0,87,217,.35));
}

/* ---- flutuação individual ----
   Cada peça da marca respira no seu próprio compasso: --p define a fase,
   --a a amplitude e --r a inclinação máxima. O período de 5s cabe 3x
   em --T, então o loop de 15s continua fechando sem salto.
   O símbolo e sua barra compartilham fase para não se descolarem;
   o pingo acompanha a fase do "i" com amplitude maior. */
.fl{
  transform-box:fill-box; transform-origin:50% 50%;
  animation: bob 5s ease-in-out infinite;
  animation-delay:var(--p,0s);
}
@keyframes bob{
  0%,100%{ transform:translateY(0) rotate(0deg) }
  26%    { transform:translateY(calc(var(--a,2.5) * -1px)) rotate(var(--r,0deg)) }
  52%    { transform:translateY(calc(var(--a,2.5) * .3px)) rotate(0deg) }
  76%    { transform:translateY(calc(var(--a,2.5) * -.5px)) rotate(calc(var(--r,0deg) * .45)) }
}

/* traço que "escreve" a logo */
.s{
  fill:none;
  stroke:var(--b2);
  stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1; stroke-dashoffset:1;
  opacity:0;
  animation: draw var(--T) cubic-bezier(.6,.05,.3,1) infinite;
  animation-delay:calc(var(--d,0) * var(--T));
  filter:drop-shadow(0 0 6px var(--b2));
}
@keyframes draw{
  0%   { stroke-dashoffset:1; opacity:0 }
  1%   { stroke-dashoffset:1; opacity:1 }
  11%  { stroke-dashoffset:0; opacity:1 }
  17%  { stroke-dashoffset:0; opacity:.55 }
  21%,100%{ stroke-dashoffset:0; opacity:0 }
}

/* preenchimento final: a logo original */
.f{
  opacity:0;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: ink var(--T) cubic-bezier(.2,.8,.2,1) infinite;
  animation-delay:calc(var(--d,0) * var(--T));
}
@keyframes ink{
  0%,4%  { opacity:0; transform:translateY(7px) scale(.97) }
  11%    { opacity:1; transform:translateY(0) scale(1) }
  90%    { opacity:1; transform:translateY(0) scale(1) }
  97%,100%{ opacity:0; transform:translateY(-5px) scale(1.03) }
}

.ink-black{ fill:var(--ink) }
.ink-blue { fill:var(--b1) }

/* pingo do "i" cai do alto */
.f-dot{
  animation: ink var(--T) cubic-bezier(.2,.8,.2,1) infinite, drop var(--T) cubic-bezier(.3,1.5,.5,1) infinite;
  animation-delay:calc(var(--d,0) * var(--T)), calc(var(--d,0) * var(--T));
}
@keyframes drop{
  0%,4% { transform:translateY(-70px) }
  12%   { transform:translateY(0) }
  100%  { transform:translateY(0) }
}

/* barra azul do símbolo desliza para o lugar */
.f-bar{
  animation: ink var(--T) cubic-bezier(.2,.8,.2,1) infinite, slide var(--T) cubic-bezier(.2,.9,.2,1) infinite;
  animation-delay:calc(var(--d,0) * var(--T)), calc(var(--d,0) * var(--T));
}
@keyframes slide{
  0%,5% { transform:translateX(-46px) }
  13%   { transform:translateX(0) }
  100%  { transform:translateX(0) }
}

/* brilho que varre a logo — uma vez na assinatura, outra no meio do ciclo */
.sweep{ animation: sweep var(--T) ease-in-out infinite; }
@keyframes sweep{
  0%, 17% { transform:translateX(-260px); opacity:0 }
  19%     { opacity:1 }
  27%     { opacity:1 }
  29%,100%{ transform:translateX(760px); opacity:0 }
}
.sweep2{ animation: sweep2 var(--T) ease-in-out infinite; }
@keyframes sweep2{
  0%, 53% { transform:translateX(-260px); opacity:0 }
  56%     { opacity:.6 }
  64%     { opacity:.6 }
  67%,100%{ transform:translateX(760px); opacity:0 }
}

/* filete que separa a marca da assinatura */
.rule{
  stroke:var(--b1); stroke-width:2.4; stroke-linecap:round;
  stroke-dasharray:98; stroke-dashoffset:98;
  animation: rule var(--T) cubic-bezier(.2,.9,.2,1) infinite;
}
@keyframes rule{
  0%,10% { stroke-dashoffset:98; opacity:0 }
  12%    { stroke-dashoffset:80; opacity:1 }
  18%    { stroke-dashoffset:0; opacity:1 }
  90%    { stroke-dashoffset:0; opacity:1 }
  96%,100%{ stroke-dashoffset:0; opacity:0 }
}

/* flash de energia */
.pulse{
  position:absolute; left:50%; top:50%;
  width:180px; height:180px; margin:-90px 0 0 -90px;
  border-radius:50%;
  border:2px solid var(--b2);
  opacity:0; pointer-events:none;
  animation: pulse var(--T) cubic-bezier(.1,.7,.3,1) infinite;
}
@keyframes pulse{
  0%,14%  { transform:scale(.2); opacity:0 }
  16%     { transform:scale(.35); opacity:.9 }
  26%     { transform:scale(3.2); opacity:0 }
  44%     { transform:scale(.3); opacity:0 }
  46%     { transform:scale(.4); opacity:.45 }
  58%     { transform:scale(2.6); opacity:0 }
  86%     { transform:scale(.3); opacity:0 }
  88%     { transform:scale(.4); opacity:.75 }
  99%,100%{ transform:scale(3.6); opacity:0 }
}

/* ---------- MUNDO (cena de hospitalidade) ---------- */
.world-wrap{
  position:absolute; left:0; right:0; bottom:3%;
  height:63%;
  z-index:2;
  opacity:0;
  animation: worldIn var(--T) cubic-bezier(.3,.9,.2,1) infinite;
}
@keyframes worldIn{
  0%,25%  { opacity:0; transform:translateY(48px) }
  34%     { opacity:1; transform:translateY(0) }
  74%     { opacity:1; transform:translateY(0) }
  81%,100%{ opacity:0; transform:translateY(34px) }
}
.world{ width:100%; height:100%; display:block; overflow:visible }

.grid path{ stroke:var(--grid); fill:none; stroke-width:1 }
.skyline{ fill:var(--pane); stroke:var(--line); stroke-width:1 }

/* chão que corre */
.floor{
  stroke:var(--b2); stroke-width:1.5; fill:none;
  stroke-dasharray:16 12;
  animation: dashrun 1.5s linear infinite;
  opacity:.55;
}
@keyframes dashrun{ to{ stroke-dashoffset:-28 } }

/* --- hotel --- */
.floorplate{
  fill:var(--pane); stroke:var(--b2); stroke-width:1.6;
  transform-box:fill-box; transform-origin:50% 100%;
  opacity:0;
  animation: rise var(--T) cubic-bezier(.2,1.3,.4,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes rise{
  0%,32%  { opacity:0; transform:translateY(26px) scaleY(.55) }
  38%     { opacity:1; transform:translateY(0) scaleY(1) }
  100%    { opacity:1; transform:translateY(0) scaleY(1) }
}
.win{
  fill:var(--b3); opacity:0;
  animation: lamp var(--T) steps(1,end) infinite;
  animation-delay:var(--d,0s);
}
@keyframes lamp{
  0%,41% { opacity:0 }
  42%    { opacity:.25 }
  43%    { opacity:.9 }
  44%    { opacity:.35 }
  45%    { opacity:1 }
  100%   { opacity:1 }
}
/* fonte de instrumentação: monoespaçada, na mesma linguagem do wireframe */
.mono{
  font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",
              Consolas,"Liberation Mono",monospace;
}

/* letreiro do hotel: placa montada na fachada */
.sign-box{
  fill:var(--bg1); stroke:var(--b1); stroke-width:1.6;
  transform-box:fill-box; transform-origin:50% 50%;
  opacity:0;
  animation: signIn var(--T) cubic-bezier(.2,1.3,.3,1) infinite;
}
@keyframes signIn{
  0%,37%{ opacity:0; transform:scaleX(.04) }
  42%   { opacity:1; transform:scaleX(1) }
  100%  { opacity:1; transform:scaleX(1) }
}
.neon{
  fill:var(--neon);
  font-size:12.5px; font-weight:700; letter-spacing:3.4px;
  text-anchor:middle;
  opacity:0;
  animation: neon var(--T) linear infinite;
  filter:drop-shadow(0 0 7px var(--b2));
}
@keyframes neon{
  0%,42%{opacity:0} 43%{opacity:.9} 44%{opacity:.1} 45%{opacity:1}
  46%{opacity:.2} 47%{opacity:1} 72%{opacity:1} 76%,100%{opacity:0}
}
.flag{
  fill:var(--b1);
  transform-box:fill-box; transform-origin:0% 50%;
  animation: wave 1.5s ease-in-out infinite;
}
@keyframes wave{ 0%,100%{transform:skewY(0deg) scaleX(1)} 50%{transform:skewY(-7deg) scaleX(.9)} }

/* a bandeira só desenrola depois que o mastro terminou de subir */
.flag-in{
  opacity:0;
  transform-box:fill-box; transform-origin:0% 50%;
  animation: unfurl var(--T) cubic-bezier(.2,1.4,.4,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes unfurl{
  0%,34%{ opacity:0; transform:scaleX(0) }
  40%   { opacity:1; transform:scaleX(1) }
  100%  { opacity:1; transform:scaleX(1) }
}

/* --- rota aérea + avião --- */
.trail{
  fill:none; stroke:var(--b2); stroke-width:1.5;
  stroke-dasharray:5 9; stroke-linecap:round;
  opacity:0;
  animation: trail var(--T) linear infinite, dashflow 1.25s linear infinite;
}
@keyframes trail{ 0%,40%{opacity:0} 45%{opacity:.4} 68%{opacity:.4} 72%,100%{opacity:0} }
@keyframes dashflow{ to{ stroke-dashoffset:-14 } }

.comet{
  fill:none; stroke:var(--b3); stroke-width:3; stroke-linecap:round;
  stroke-dasharray:.045 1;
  opacity:0;
  animation: cometMove var(--T) linear infinite, cometFade var(--T) linear infinite;
  filter:drop-shadow(0 0 8px var(--b2));
}
@keyframes cometMove{ 0%,42%{stroke-dashoffset:.045} 66%,100%{stroke-dashoffset:-.955} }
@keyframes cometFade{ 0%,42%{opacity:0} 45%{opacity:.9} 63%{opacity:.9} 66%,100%{opacity:0} }

.plane{
  offset-path:path("M-80,150 C 90,58 268,22 470,42 C 664,60 812,112 1050,64");
  offset-rotate:auto;
  filter:drop-shadow(0 0 7px rgba(59,134,255,.55));
  animation: fly var(--T) linear infinite, planeFade var(--T) linear infinite;
}
@keyframes fly{ 0%,42%{offset-distance:0%} 66%,100%{offset-distance:100%} }
@keyframes planeFade{ 0%,42%{opacity:0} 45%{opacity:1} 63%{opacity:1} 66%,100%{opacity:0} }

/* --- ônibus --- */
.bus{ animation: busGo var(--T) linear infinite }
@keyframes busGo{
  0%,36%  { transform:translateX(-210px); opacity:0 }
  38%     { opacity:1 }
  56%     { opacity:1 }
  58%,100%{ transform:translateX(1130px); opacity:0 }
}
.wheel{ transform-box:fill-box; transform-origin:50% 50%; animation: spin .6s linear infinite }
@keyframes spin{ to{ transform:rotate(360deg) } }

/* --- chips de módulos --- */
.chip{
  transform-box:fill-box; transform-origin:50% 50%;
  opacity:0;
  animation: pop var(--T) cubic-bezier(.2,1.5,.4,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes pop{
  0%,38% { opacity:0; transform:scale(.3) }
  44%    { opacity:1; transform:scale(1) }
  100%   { opacity:1; transform:scale(1) }
}
.chip-ring{ fill:var(--pane); stroke:var(--b2); stroke-width:1.6 }
.chip-arc{
  fill:none; stroke:var(--b1); stroke-width:2.4; stroke-linecap:round;
  stroke-dasharray:56 158;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: orbit 3s linear infinite;
}
@keyframes orbit{ to{ transform:rotate(360deg) } }
/* ---- rótulos dos módulos: placa de instrumentação ----
   Entram em três tempos — o conector desce do chip, a placa abre
   na horizontal e as letras se recolhem ao espaçamento final. */
.lb-tick{
  fill:none; stroke:var(--b2); stroke-width:1.4;
  stroke-dasharray:9; stroke-dashoffset:9;
  animation: tick var(--T) ease-out infinite;
  animation-delay:var(--d,0s);
}
@keyframes tick{
  0%,42%{ stroke-dashoffset:9; opacity:0 }
  44%   { stroke-dashoffset:9; opacity:1 }
  47%   { stroke-dashoffset:0; opacity:1 }
  100%  { stroke-dashoffset:0; opacity:1 }
}
.lb-box{
  fill:var(--bg1); stroke:var(--b2); stroke-width:1.3;
  transform-box:fill-box; transform-origin:50% 50%;
  opacity:0;
  animation: boxIn var(--T) cubic-bezier(.2,1.25,.3,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes boxIn{
  0%,46%{ opacity:0; transform:scaleX(.04) }
  51%   { opacity:1; transform:scaleX(1) }
  100%  { opacity:1; transform:scaleX(1) }
}
.chip-lb{
  fill:var(--ink); font-size:11px; font-weight:700; letter-spacing:2.4px;
  text-anchor:middle; opacity:0;
  animation: lbIn var(--T) cubic-bezier(.2,.9,.2,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes lbIn{
  0%,50%{ opacity:0; letter-spacing:7px }
  56%   { opacity:1; letter-spacing:2.4px }
  100%  { opacity:1; letter-spacing:2.4px }
}

/* selo de inteligência no módulo online */
.spark{
  fill:var(--b1); stroke:none; opacity:0;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: sparkIn var(--T) ease-out infinite, twinkleSpark 2.5s ease-in-out infinite;
  animation-delay:var(--d,0s), 0s;
}
@keyframes sparkIn{ 0%,54%{opacity:0} 59%{opacity:1} 100%{opacity:1} }
@keyframes twinkleSpark{
  0%,100%{ transform:scale(.82) rotate(0deg) }
  50%    { transform:scale(1.15) rotate(45deg) }
}

/* nós de rede ao redor do globo: conectividade + inteligência */
.net-link{ fill:none; stroke:var(--b1); stroke-width:1.1; opacity:.45 }
.node{
  fill:var(--b1); stroke:none;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: nodePulse 2.5s ease-in-out infinite;
  animation-delay:var(--d,0s);
}
@keyframes nodePulse{
  0%,100%{ opacity:.35; transform:scale(.75) }
  50%    { opacity:1;   transform:scale(1.35) }
}
.ic{ fill:none; stroke:var(--b3); stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
.ic .solid{ fill:var(--b3); stroke:none }

/* linhas que ligam os módulos ao hotel */
.link{
  fill:none; stroke:var(--b2); stroke-width:1.4;
  stroke-dasharray:3 7; opacity:0;
  animation: linkIn var(--T) linear infinite, linkFlow 1s linear infinite;
  animation-delay:var(--d,0s), 0s;
}
@keyframes linkIn{ 0%,43%{opacity:0} 49%{opacity:.55} 100%{opacity:.55} }
@keyframes linkFlow{ to{ stroke-dashoffset:-10 } }

/* vapor do prato */
.steam path{ animation: steam 2.5s ease-in-out infinite; opacity:0 }
.steam path:nth-child(2){ animation-delay:.35s }
.steam path:nth-child(3){ animation-delay:.7s }
@keyframes steam{ 0%{opacity:0; transform:translateY(4px)} 40%{opacity:.9} 100%{opacity:0; transform:translateY(-9px)} }

/* coração do motel */
.heart{
  fill:var(--b1); stroke:none;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: beat 1.25s ease-in-out infinite;
}
@keyframes beat{ 0%,100%{transform:scale(1)} 20%{transform:scale(1.28)} 40%{transform:scale(1)} 60%{transform:scale(1.16)} }

/* barras do revenue */
.rv{
  fill:var(--b3); transform-box:fill-box; transform-origin:50% 100%;
  animation: grow var(--T) cubic-bezier(.2,1.2,.3,1) infinite;
  animation-delay:var(--d,0s);
}
@keyframes grow{ 0%,46%{transform:scaleY(.08)} 56%{transform:scaleY(1)} 100%{transform:scaleY(1)} }
.rv-arrow{
  stroke:var(--b1); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:60; stroke-dashoffset:60;
  animation: arrow var(--T) ease-out infinite;
}
@keyframes arrow{ 0%,52%{stroke-dashoffset:60} 60%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }

/* globo online */
.globe-ring{
  fill:none; stroke:var(--b1); stroke-width:2;
  transform-box:fill-box; transform-origin:50% 50%;
  animation: tilt 3s linear infinite;
}
@keyframes tilt{ 0%{transform:rotate(-20deg) scaleX(1)} 50%{transform:rotate(-20deg) scaleX(.25)} 100%{transform:rotate(-20deg) scaleX(1)} }

/* ---------- controles ---------- */
.ctrl{
  position:fixed; top:16px; right:16px; z-index:9;
  display:flex; gap:8px;
  transition:opacity .45s ease, transform .45s ease;
}
/* somem sozinhos; só reaparecem com o cursor perto deles */
.ctrl.is-hidden{ opacity:0; transform:translateY(-10px); pointer-events:none }
.ctrl button{
  display:inline-flex; align-items:center; gap:8px;
  height:34px; padding:0 14px;
  border-radius:99px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--sub);
  font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;
  letter-spacing:1.5px; text-transform:uppercase;
  cursor:pointer; transition:.22s;
  -webkit-user-select:none; user-select:none;
}
.ctrl button:hover{ color:var(--b2); border-color:var(--b2) }
.ctrl .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--line); transition:.22s;
}
.ctrl button[aria-pressed="true"]{ color:var(--b3); border-color:rgba(59,134,255,.45) }
.ctrl button[aria-pressed="true"] .dot{ background:var(--b2); box-shadow:0 0 9px var(--b2) }

@media (max-width:720px){ :root{ --lift:120px } .brand{ width:82vw } }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important }
  .f{ opacity:1 } .s,.world-wrap,.pulse{ opacity:0 }
}
</style>

<script>
  var root = document.documentElement;

  /* tema claro / escuro */
  document.getElementById('btTheme').addEventListener('click', function(){
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('bitz.theme', root.dataset.theme); }catch(e){}
  });

  /* cenário ligado / desligado — desligado deixa só a logo e o fundo */
  var btScene = document.getElementById('btScene');
  function setScene(on){
    root.dataset.scene = on ? 'on' : 'off';
    btScene.setAttribute('aria-pressed', on ? 'true' : 'false');
    try{ localStorage.setItem('bitz.scene', root.dataset.scene); }catch(e){}
  }
  btScene.addEventListener('click', function(){
    setScene(root.dataset.scene !== 'on');
  });

  /* restaura a última escolha */
  try{
    var t = localStorage.getItem('bitz.theme');
    if(t){ root.dataset.theme = t; }
    setScene(localStorage.getItem('bitz.scene') !== 'off');
  }catch(e){ setScene(true); }

  /* ---- os controles se escondem após 5s de inatividade ----
     Só o cursor dentro da zona dos botões (ou até 130px em volta) os traz
     de volta; mover o mouse em qualquer outro ponto da tela não interfere. */
  var ctrl = document.querySelector('.ctrl'), MARGEM = 130, hideT;

  function agendarOcultar(){
    clearTimeout(hideT);
    hideT = setTimeout(function(){
      if(ctrl.matches(':hover')){ agendarOcultar(); return; }  /* cursor parado em cima: mantém */
      ctrl.classList.add('is-hidden');
    }, 5000);
  }
  function revelar(){
    ctrl.classList.remove('is-hidden');
    agendarOcultar();
  }
  function pertoDosControles(x, y){
    var r = ctrl.getBoundingClientRect();
    return x >= r.left - MARGEM && x <= r.right + MARGEM &&
           y >= r.top  - MARGEM && y <= r.bottom + MARGEM;
  }

  document.addEventListener('mousemove', function(e){
    if(pertoDosControles(e.clientX, e.clientY)){ revelar(); }
  });
  ctrl.addEventListener('click', revelar);
  document.addEventListener('touchstart', revelar, {passive:true});  /* sem cursor, um toque revela */

  agendarOcultar();
</script>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitz Loader — Hospitalidade</title>
<style>
  :root {
    --bitz-blue: #0057d9;
    --cycle: 11s;
  }

  body {
    background-color: #ffffff;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .bitz-hosp {
    width: min(92vw, 720px);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .bitz-hosp__scene {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* ==========================================================================
     Todo o "mundo" de hospitalidade (ceu, predio, carro, aviao, grafico) mora
     num unico grupo com uma unica animacao de visibilidade, presa a um
     relogio-mestre de 11s. Isso garante o pedido central: a logo comeca
     SOZINHA (0%-14%), o cenario entra, vive, sai, e a logo volta a ficar
     sozinha (86%-100%) -- que e exatamente onde o loop fecha (100% = 0%),
     entao o "sozinha" do fim e o "sozinha" do comeco sao o MESMO instante
     contínuo, sem costura. Cada elemento dentro do cenario tem seu proprio
     looping independente (aviao voando, carro rodando, janelas acendendo) —
     eles nunca precisam saber da hora exata, so ficam sempre em movimento
     quando estao visiveis.
     ========================================================================== */
  .bitz-hosp__world {
    animation: hosp-visibility var(--cycle) ease-in-out infinite;
  }

  @keyframes hosp-visibility {
    0%, 14%   { opacity: 0; transform: translateY(18px); }
    22%, 78%  { opacity: 1; transform: translateY(0); }
    86%, 100% { opacity: 0; transform: translateY(18px); }
  }

  /* ---- ceu: sol/lua ---- */
  .hosp-sun, .hosp-moon {
    transform-origin: 0px 0px;
  }
  .hosp-sun { animation: hosp-sun-fade 9s ease-in-out infinite; }
  .hosp-moon { animation: hosp-moon-fade 9s ease-in-out infinite; }
  @keyframes hosp-sun-fade  { 0%, 38% { opacity: 1; } 50%, 88% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes hosp-moon-fade { 0%, 38% { opacity: 0; } 50%, 88% { opacity: 1; } 100% { opacity: 0; } }

  .hosp-sun-rays {
    transform-origin: 0px 0px;
    animation: hosp-sun-spin 14s linear infinite;
  }
  @keyframes hosp-sun-spin { to { transform: rotate(360deg); } }

  /* ---- predio: janelas acendendo (reservas acontecendo em tempo real) ---- */
  .hosp-window {
    fill: #c9d6ea;
    animation: hosp-window-glow 3.4s ease-in-out infinite;
  }
  @keyframes hosp-window-glow {
    0%, 55%  { fill: #c9d6ea; }
    72%, 88% { fill: #ffc069; }
    100%     { fill: #c9d6ea; }
  }

  /* ---- bandeirinha no telhado: reaproveita o simbolo original (via <use>),
     so balançando ---- */
  .hosp-roof-flag-flutter {
    transform-origin: 0px 0px;
    animation: hosp-flutter 1.8s ease-in-out infinite;
  }
  @keyframes hosp-flutter {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    50%      { transform: skewY(-9deg) scaleX(0.95); }
  }
  .hosp-roof-flag { fill: url(#bitzBlueGrad); }

  /* ---- coqueiro balançando ---- */
  .hosp-palm-sway {
    transform-origin: 0px 0px;
    animation: hosp-sway 4.2s ease-in-out infinite;
  }
  @keyframes hosp-sway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  /* ---- carrinho/van rodando pela estrada, em loop continuo ---- */
  .hosp-car-drive {
    animation: hosp-car-x 6.5s linear infinite;
  }
  @keyframes hosp-car-x {
    from { transform: translateX(-110px); }
    to   { transform: translateX(1110px); }
  }
  .hosp-wheel-spin {
    transform-origin: 0px 0px;
    animation: hosp-wheel-spin 0.5s linear infinite;
  }
  @keyframes hosp-wheel-spin { to { transform: rotate(360deg); } }

  /* ---- aviao cruzando o ceu, com balanco suave (bob) ---- */
  .hosp-plane-drive {
    animation: hosp-plane-x 7.5s linear infinite;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.15));
  }
  @keyframes hosp-plane-x {
    from { transform: translateX(-90px); }
    to   { transform: translateX(1090px); }
  }
  .hosp-plane-bob {
    transform-origin: 25px 8px;
    animation: hosp-plane-bob 1.7s ease-in-out infinite;
  }
  @keyframes hosp-plane-bob {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50%      { transform: translateY(-13px) rotate(3deg); }
  }

  /* ---- grafico de receita (revenue management) pulsando ---- */
  .hosp-bar {
    transform-origin: 0px 0px;
    animation: hosp-bar-grow 2.1s ease-in-out infinite;
  }
  @keyframes hosp-bar-grow {
    0%, 100% { transform: scaleY(0.55); }
    50%      { transform: scaleY(1); }
  }

  /* ==========================================================================
     Wordmark + orbito reaproveitados: EXATAMENTE o mesmo SVG do loader
     original (paths, defs e classes idênticos, sem alterar nenhum "d"),
     só que colocados dentro de um <g transform="..."> pra caber nessa nova
     composição. O mecanismo do anel (grow-uma-vez + spin infinito linear)
     e o cross-fade do simbolo de repouso continuam os mesmos, testados.
     ========================================================================== */
  .bitz-loader__wordmark {
    transform-origin: 531.5px 288.25px;
    animation: bitz-breathe 2.6s ease-in-out infinite;
  }
  .bitz-loader__bitz {
    fill: url(#bitzBlackGrad);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
  }
  .bitz-loader__allinone {
    fill: url(#bitzBlueGrad);
    filter: drop-shadow(0 3px 6px rgba(0, 87, 217, 0.25));
  }
  @keyframes bitz-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }

  .bitz-loader__ground {
    fill: #000000;
    opacity: 0.08;
    filter: blur(6px);
  }

  .bitz-loader__flag-rest {
    fill: url(#bitzBlueGrad);
    filter: drop-shadow(0 0 10px rgba(0, 87, 217, 0.5));
    animation: bitz-flag-fade 0.5s ease-in forwards;
  }
  @keyframes bitz-flag-fade { to { opacity: 0; } }

  .bitz-loader__orbit {
    opacity: 0;
    animation: bitz-orbit-fadein 0.55s ease-out forwards 0.05s;
  }
  @keyframes bitz-orbit-fadein { to { opacity: 1; } }

  .bitz-loader__orbit-glow {
    fill: none;
    stroke: var(--bitz-blue);
    stroke-width: 30;
    stroke-linecap: round;
    stroke-dashoffset: 0;
    opacity: 0.32;
    filter: blur(11px);
    animation:
      bitz-orbit-grow 0.6s cubic-bezier(0.3, 0, 0.2, 1) 0.05s forwards,
      bitz-orbit-spin 2.6s linear 0.65s infinite;
  }
  .bitz-loader__orbit-arc {
    fill: none;
    stroke: url(#bitzBlueGrad);
    stroke-width: 17;
    stroke-linecap: round;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 2px 4px rgba(0, 87, 217, 0.35));
    animation:
      bitz-orbit-grow 0.6s cubic-bezier(0.3, 0, 0.2, 1) 0.05s forwards,
      bitz-orbit-spin 2.6s linear 0.65s infinite;
  }
  @keyframes bitz-orbit-grow {
    from { stroke-dasharray: 0 100; }
    to   { stroke-dasharray: 56 44; }
  }
  @keyframes bitz-orbit-spin {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -100; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bitz-hosp__world { animation: none; opacity: 0; }
    .bitz-loader__wordmark { animation: none; }
    .bitz-loader__flag-rest { animation: none; opacity: 0; }
    .bitz-loader__orbit { animation: none; opacity: 1; }
    .bitz-loader__orbit-glow, .bitz-loader__orbit-arc { animation-duration: 0.6s, 8s; }
  }
</style>
</head>
